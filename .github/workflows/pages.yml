name: Deploy Mapadamente to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Collect project media
        shell: bash
        run: |
          set -e
          mkdir -p public/media
          fetch_media () {
            primary="$1"
            fallback="$2"
            output="$3"
            curl --fail --location --retry 2 --connect-timeout 15 "$primary" --output "$output" \
              || curl --fail --location --retry 2 --connect-timeout 15 "$fallback" --output "$output"
          }
          fetch_media "https://mapadamente.com.br/img/img_home/cabecalho.jpg" "http://mapadamente.com.br/img/img_home/cabecalho.jpg" "public/media/cabecalho.jpg"
          fetch_media "https://mapadamente.com.br/foto%20fredo.fw.png" "http://mapadamente.com.br/foto%20fredo.fw.png" "public/media/alfredo.png"
          fetch_media "https://mapadamente.com.br/CAPS_SP.pdf" "http://mapadamente.com.br/CAPS_SP.pdf" "public/media/CAPS_SP.pdf"

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
